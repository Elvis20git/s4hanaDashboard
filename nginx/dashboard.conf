# Managed by certbot: sudo certbot --nginx -d dashboard.africaimprovedfoods.com

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.africaimprovedfoods.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.africaimprovedfoods.com;
    server_tokens off;

    # TLS — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/dashboard.africaimprovedfoods.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.africaimprovedfoods.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    630s;   # SAP refresh takes up to 10 min
        proxy_send_timeout    60s;
    }
}
